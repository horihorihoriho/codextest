<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     role="img" aria-labelledby="t d">
  <title id="t">セキュリティを熟知したエンジニア</title>
  <desc id="d">盾とコードを背景に立つエンジニアのフラットイラスト。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#0a6cb8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0a6cb8"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0a6cb8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg4)"/>

  <!-- code lines (background pattern) -->
  <g font-family="ui-monospace, monospace" font-size="14" fill="#5fd8c8" opacity="0.15">
    <text x="40" y="60">{ "secure": true,</text>
    <text x="60" y="80">  "audit": "v3" }</text>
    <text x="40" y="700">function audit() {</text>
    <text x="60" y="720">  return ok;</text>
    <text x="40" y="740">}</text>
    <text x="380" y="120">if (auth.ok) {</text>
    <text x="400" y="140">  grant();</text>
    <text x="380" y="160">}</text>
    <text x="380" y="660">// 20+ years</text>
    <text x="380" y="680">verify(req)</text>
  </g>

  <g stroke="#5fd8c8" stroke-width="1" opacity="0.18" fill="none">
    <circle cx="120" cy="220" r="40"/>
    <circle cx="480" cy="500" r="60"/>
    <circle cx="120" cy="600" r="30"/>
    <circle cx="480" cy="220" r="20"/>
  </g>

  <!-- shield big -->
  <g transform="translate(170,90)" opacity="0.95">
    <path d="M130 0 L260 50 L240 220 Q130 330 130 330 Q130 330 20 220 L0 50 Z" fill="url(#shield)" opacity="0.25"/>
    <path d="M130 30 L230 70 L215 200 Q130 290 130 290 Q130 290 45 200 L30 70 Z" fill="url(#shield)" opacity="0.55"/>
    <!-- check -->
    <path d="M85 165 L120 200 L185 130" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- person -->
  <g transform="translate(170,330)">
    <!-- shadow -->
    <ellipse cx="130" cy="395" rx="135" ry="14" fill="#000" opacity="0.25"/>

    <!-- body -->
    <path d="M40 390 Q40 230 130 230 Q220 230 220 390 Z" fill="url(#shirt)"/>
    <!-- belt -->
    <rect x="40" y="375" width="180" height="14" fill="#0a2540"/>

    <!-- arms -->
    <path d="M55 270 Q25 340 50 390" stroke="#14b8a6" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M205 270 Q235 340 210 390" stroke="#14b8a6" stroke-width="34" fill="none" stroke-linecap="round"/>

    <!-- laptop in hand -->
    <g transform="translate(80,330) rotate(-4)">
      <rect x="0" y="20" width="100" height="60" rx="6" fill="#1a2a3a"/>
      <rect x="6" y="26" width="88" height="48" rx="3" fill="#0a2540"/>
      <g stroke="#5fd8c8" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M14 40 L40 40"/>
        <path d="M14 50 L60 50"/>
        <path d="M14 60 L34 60"/>
      </g>
      <rect x="-4" y="80" width="108" height="6" rx="3" fill="#1a2a3a"/>
    </g>

    <!-- neck -->
    <rect x="115" y="200" width="30" height="35" fill="#e8b896"/>
    <!-- head -->
    <circle cx="130" cy="170" r="50" fill="#e8b896"/>
    <!-- hair -->
    <path d="M82 165 Q82 110 130 105 Q178 110 178 165 Q178 140 165 135 Q148 130 130 132 Q105 134 92 152 Z" fill="#1a2a3a"/>
    <!-- glasses -->
    <g stroke="#1a2a3a" stroke-width="2.5" fill="none">
      <circle cx="115" cy="172" r="10"/>
      <circle cx="145" cy="172" r="10"/>
      <line x1="125" y1="172" x2="135" y2="172"/>
    </g>
    <!-- smile -->
    <path d="M118 192 Q130 200 142 192" stroke="#1a2a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- floating lock badge -->
  <g transform="translate(70,420)">
    <circle cx="0" cy="0" r="30" fill="#14b8a6"/>
    <rect x="-12" y="-6" width="24" height="20" rx="3" fill="#fff"/>
    <path d="M-8 -6 Q-8 -18 0 -18 Q8 -18 8 -6" stroke="#fff" stroke-width="3" fill="none"/>
    <circle cx="0" cy="4" r="3" fill="#14b8a6"/>
  </g>

  <!-- floating key badge -->
  <g transform="translate(500,420)">
    <circle cx="0" cy="0" r="30" fill="#5fd8c8"/>
    <circle cx="-6" cy="-2" r="8" fill="none" stroke="#0a2540" stroke-width="3"/>
    <path d="M0 -2 L14 -2 L14 4 L10 4 L10 8" stroke="#0a2540" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
