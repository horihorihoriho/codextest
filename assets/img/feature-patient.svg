<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t d">
  <title id="t">予約情報から患者様を事前把握</title>
  <desc id="d">カルテボードとカレンダー、患者アイコンの組み合わせ。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4fb"/>
      <stop offset="1" stop-color="#d4edf7"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <circle cx="500" cy="80" r="70" fill="#14b8a6" opacity="0.12"/>
  <circle cx="80" cy="340" r="80" fill="#0a6cb8" opacity="0.10"/>

  <!-- calendar -->
  <g transform="translate(60,90)">
    <rect x="0" y="20" width="200" height="200" rx="14" fill="#fff" stroke="#cbd8e2" stroke-width="2"/>
    <rect x="0" y="20" width="200" height="44" rx="14" fill="#0a6cb8"/>
    <rect x="0" y="46" width="200" height="18" fill="#0a6cb8"/>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fff">JULY 2026</text>
    <g fill="#5a7a9a" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
      <text x="20" y="82">月</text><text x="50" y="82">火</text><text x="80" y="82">水</text><text x="110" y="82">木</text><text x="140" y="82">金</text><text x="170" y="82">土</text>
    </g>
    <g fill="#1a2a3a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
      <text x="20" y="110">1</text><text x="50" y="110">2</text><text x="80" y="110">3</text><text x="110" y="110">4</text><text x="140" y="110">5</text><text x="170" y="110">6</text>
      <text x="20" y="138">7</text><text x="50" y="138">8</text><text x="80" y="138">9</text><text x="110" y="138">10</text><text x="140" y="138">11</text><text x="170" y="138">12</text>
      <text x="20" y="166">13</text><text x="50" y="166">14</text><text x="80" y="166">15</text><text x="110" y="166">16</text><text x="140" y="166">17</text><text x="170" y="166">18</text>
      <text x="20" y="194">19</text><text x="50" y="194">20</text><text x="80" y="194">21</text>
    </g>
    <!-- highlight today -->
    <circle cx="110" cy="134" r="12" fill="#14b8a6"/>
    <text x="110" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#fff">10</text>
  </g>

  <!-- chart board -->
  <g transform="translate(310,80)">
    <rect x="0" y="0" width="240" height="240" rx="14" fill="url(#board)" stroke="#cbd8e2" stroke-width="2"/>
    <rect x="60" y="-12" width="120" height="28" rx="6" fill="#0a6cb8"/>
    <circle cx="120" cy="2" r="4" fill="#fff"/>
    <!-- patient avatar -->
    <g transform="translate(30,30)">
      <circle cx="20" cy="20" r="18" fill="#14b8a6"/>
      <circle cx="20" cy="14" r="6" fill="#fff"/>
      <path d="M8 28 Q20 20 32 28 L32 38 L8 38 Z" fill="#fff"/>
    </g>
    <text x="80" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0a2540">山田 太郎</text>
    <text x="80" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#5a7a9a">68歳・男性</text>

    <line x1="20" y1="86" x2="220" y2="86" stroke="#cbd8e2" stroke-width="1"/>

    <rect x="20" y="100" width="60" height="14" rx="3" fill="#0a6cb8"/>
    <text x="50" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#fff">高血圧</text>
    <rect x="86" y="100" width="50" height="14" rx="3" fill="#14b8a6"/>
    <text x="111" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#fff">糖尿病</text>

    <rect x="20" y="130" width="200" height="6" rx="3" fill="#0a6cb8" opacity="0.5"/>
    <rect x="20" y="146" width="170" height="6" rx="3" fill="#0a6cb8" opacity="0.3"/>
    <rect x="20" y="162" width="190" height="6" rx="3" fill="#0a6cb8" opacity="0.3"/>
    <rect x="20" y="178" width="140" height="6" rx="3" fill="#0a6cb8" opacity="0.3"/>

    <!-- mini chart -->
    <g transform="translate(20,196)">
      <rect x="0" y="0" width="200" height="34" rx="6" fill="#f0f8fc"/>
      <g stroke="#14b8a6" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M10 24 L40 18 L70 22 L100 12 L130 16 L160 8 L190 12"/>
      </g>
    </g>
  </g>

  <!-- arrow -->
  <g stroke="#0a6cb8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 200 L300 200"/>
    <path d="M286 188 L300 200 L286 212"/>
  </g>
</svg>
