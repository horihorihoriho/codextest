<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400"
     role="img" aria-labelledby="t d">
  <title id="t">音声入力でSOAPを自動記録</title>
  <desc id="d">マイクと波形、SOAPフォームのフラットイラスト。</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4fb"/>
      <stop offset="1" stop-color="#d4edf7"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a6cb8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <circle cx="120" cy="80" r="60" fill="#14b8a6" opacity="0.12"/>
  <circle cx="520" cy="340" r="80" fill="#0a6cb8" opacity="0.10"/>

  <!-- SOAP card -->
  <g transform="translate(310,80)">
    <rect x="0" y="0" width="240" height="260" rx="16" fill="#fff" stroke="#cbd8e2" stroke-width="2"/>
    <rect x="20" y="20" width="60" height="14" rx="3" fill="#0a6cb8"/>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#0a2540">SOAP</text>
    <g>
      <circle cx="32" cy="92" r="10" fill="#0a6cb8"/>
      <text x="32" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#fff">S</text>
      <rect x="52" y="86" width="160" height="6" rx="3" fill="#0a6cb8" opacity="0.6"/>
      <rect x="52" y="98" width="120" height="6" rx="3" fill="#0a6cb8" opacity="0.3"/>
    </g>
    <g>
      <circle cx="32" cy="132" r="10" fill="#14b8a6"/>
      <text x="32" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#fff">O</text>
      <rect x="52" y="126" width="160" height="6" rx="3" fill="#14b8a6" opacity="0.6"/>
      <rect x="52" y="138" width="140" height="6" rx="3" fill="#14b8a6" opacity="0.3"/>
    </g>
    <g>
      <circle cx="32" cy="172" r="10" fill="#0a6cb8"/>
      <text x="32" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#fff">A</text>
      <rect x="52" y="166" width="160" height="6" rx="3" fill="#0a6cb8" opacity="0.6"/>
      <rect x="52" y="178" width="100" height="6" rx="3" fill="#0a6cb8" opacity="0.3"/>
    </g>
    <g>
      <circle cx="32" cy="212" r="10" fill="#14b8a6"/>
      <text x="32" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#fff">P</text>
      <rect x="52" y="206" width="160" height="6" rx="3" fill="#14b8a6" opacity="0.6"/>
      <rect x="52" y="218" width="130" height="6" rx="3" fill="#14b8a6" opacity="0.3"/>
    </g>
  </g>

  <!-- arrow -->
  <g stroke="#0a6cb8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M225 200 L295 200"/>
    <path d="M280 188 L295 200 L280 212"/>
  </g>

  <!-- microphone -->
  <g transform="translate(60,90)">
    <circle cx="90" cy="110" r="98" fill="#fff" opacity="0.6"/>
    <rect x="60" y="40" width="60" height="120" rx="30" fill="url(#mic)"/>
    <rect x="78" y="58" width="24" height="20" rx="4" fill="#fff" opacity="0.35"/>
    <path d="M40 130 Q40 180 90 180 Q140 180 140 130" stroke="#0a6cb8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="84" y="180" width="12" height="24" fill="#0a6cb8"/>
    <rect x="60" y="200" width="60" height="8" rx="4" fill="#0a6cb8"/>
    <!-- waves -->
    <g stroke="#14b8a6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M28 100 Q14 110 28 130"/>
      <path d="M14 90 Q-6 110 14 140"/>
      <path d="M152 100 Q166 110 152 130"/>
      <path d="M166 90 Q186 110 166 140"/>
    </g>
  </g>
</svg>
